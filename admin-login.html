<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login - Event World</title>
<script src="event-data.js"></script>
<script src="notifications.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #030508;
    --panel: rgba(10,20,35,0.88);
    --accent: #00f0ff;
    --accent2: #7b2fff;
    --accent3: #ff2d78;
    --text: #e0eeff;
    --muted: #6f87a3;
    --border: rgba(0,240,255,0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.2rem;
    background:
      radial-gradient(circle at 20% 20%, rgba(0,240,255,0.14), transparent 30%),
      radial-gradient(circle at 80% 72%, rgba(123,47,255,0.18), transparent 32%),
      var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    cursor: none;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(0,240,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,0.035) 1px, transparent 1px);
    background-size: 54px 54px;
  }
  .card {
    width: min(430px, 100%);
    position: relative;
    z-index: 1;
    padding: 2rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.45), 0 0 45px rgba(0,240,255,0.08);
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0 0 auto;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
  }
  .brand {
    color: var(--accent);
    font: 900 1rem 'Orbitron', monospace;
    letter-spacing: 2px;
    margin-bottom: 2rem;
  }
  h1 {
    font: 900 1.65rem 'Orbitron', monospace;
    margin-bottom: 0.55rem;
  }
  p {
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 1.5rem;
  }
  label {
    display: block;
    color: var(--muted);
    font: 700 0.72rem 'Space Mono', monospace;
    text-transform: uppercase;
    margin-bottom: 0.38rem;
  }
  .group { margin-bottom: 1rem; }
  input {
    width: 100%;
    color: var(--text);
    background: rgba(8,13,20,0.92);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.82rem 0.9rem;
    outline: none;
    font: 600 1rem 'Rajdhani', sans-serif;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(0,240,255,0.14);
  }
  button {
    width: 100%;
    border: none;
    border-radius: 8px;
    margin-top: 0.5rem;
    padding: 0.95rem 1rem;
    color: #000;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    cursor: pointer;
    font: 900 0.82rem 'Orbitron', monospace;
    letter-spacing: 1px;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 1.2rem;
    transform: translateX(-50%) translateY(90px);
    z-index: 10;
    color: var(--accent3);
    border: 1px solid var(--accent3);
    background: rgba(8,13,20,0.96);
    border-radius: 8px;
    padding: 0.78rem 1rem;
    font: 700 0.78rem 'Space Mono', monospace;
    transition: transform 0.25s ease;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<main class="card">
  <div class="brand">EVENT.WORLD ADMIN</div>
  <h1>&#128737; Admin Portal</h1>
  <p>This console is hidden from public navigation and only opens for verified Event World admins.</p>
  <form onsubmit="handleAdminLogin(event)">
    <div class="group">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="Admin email"/>
    </div>
    <div class="group">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Admin password"/>
    </div>
    <button type="submit">Enter Admin Console</button>
  </form>
  <p style="margin:1rem 0 0;font-size:.85rem">This page is not publicly listed</p>
</main>
<div class="toast" id="toast"></div>

<script>
async function handleAdminLogin(event) {
  event.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) {
    showError('Enter admin email and password');
    return;
  }
  try {
    if (!window.EventWorldAPI) throw new Error('Admin API is unavailable');
    await window.EventWorldAPI.login(email, password, 'admin', { remember: true });
    document.body.classList.add('page-fade-out');
    setTimeout(() => { window.location.href = 'admin.html'; }, 200);
    return;
  } catch (error) {
    showError('Invalid admin credentials');
  }
}

function showError(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>
</body>
</html>
