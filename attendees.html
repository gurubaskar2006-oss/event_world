<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Attendees - Event World</title>
<script src="event-data.js"></script>
<script src="notifications.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#030508; --card:rgba(10,20,35,0.85); --accent:#00f0ff; --accent2:#7b2fff; --accent3:#ff2d78;
    --green:#00ff88; --warn:#ffd166; --text:#e0eeff; --muted:#5a7a9a; --border:rgba(0,240,255,0.15);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh;
    color:var(--text);
    font-family:'Rajdhani',sans-serif;
    background:
      radial-gradient(circle at 18% 14%, rgba(0,240,255,.13), transparent 32%),
      radial-gradient(circle at 82% 30%, rgba(123,47,255,.16), transparent 34%),
      var(--bg);
  }
  .wrap { width:min(1180px, calc(100% - 2rem)); margin:0 auto; padding:1.5rem 0 4rem; }
  nav {
    display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1.5rem;
    border:1px solid var(--border); border-radius:14px; padding:.8rem 1rem; background:rgba(10,20,35,.7);
  }
  .logo { color:var(--accent); text-decoration:none; font:900 1.1rem 'Orbitron',monospace; letter-spacing:2px; }
  .nav-title { color:var(--text); font:800 .85rem 'Space Mono',monospace; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-actions { display:flex; flex-wrap:wrap; gap:.55rem; justify-content:flex-end; }
  button, .btn {
    border:none; border-radius:8px; min-height:40px; padding:.65rem .9rem; cursor:pointer;
    font:900 .72rem 'Orbitron',monospace; letter-spacing:.6px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
  }
  .primary { color:#00150c; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  .green { color:#00150c; background:linear-gradient(135deg,var(--green),var(--accent)); }
  .ghost { color:var(--accent); border:1px solid rgba(0,240,255,.24); background:rgba(0,240,255,.08); }
  .danger { color:var(--accent3); border:1px solid rgba(255,45,120,.28); background:rgba(255,45,120,.08); }
  .disabled { color:rgba(224,238,255,.55); background:rgba(90,122,154,.18); cursor:not-allowed; }
  .hero {
    display:grid; grid-template-columns:minmax(0,1fr) auto; gap:1rem; align-items:end; margin-bottom:1rem;
    border:1px solid var(--border); border-radius:18px; padding:1.4rem; background:var(--card);
  }
  .eyebrow { color:var(--accent); font:800 .72rem 'Space Mono',monospace; letter-spacing:2px; text-transform:uppercase; }
  h1 { margin:.35rem 0; font:900 clamp(1.8rem,5vw,3.4rem) 'Orbitron',monospace; line-height:1.05; }
  p { color:var(--muted); line-height:1.55; }
  .updated { color:var(--muted); font:700 .75rem 'Space Mono',monospace; }
  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.9rem; margin:1rem 0; }
  .stat { border:1px solid var(--border); border-radius:14px; padding:1rem; background:var(--card); }
  .stat strong { display:block; font:900 1.65rem 'Orbitron',monospace; }
  .stat span { color:var(--muted); font:800 .68rem 'Space Mono',monospace; text-transform:uppercase; }
  .cyan strong { color:var(--accent); } .ok strong { color:var(--green); } .yellow strong { color:var(--warn); } .pink strong { color:var(--accent3); }
  .tools {
    display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.8rem; align-items:center; margin:1rem 0;
    border:1px solid var(--border); border-radius:14px; padding:.9rem; background:rgba(10,20,35,.68);
  }
  input {
    width:100%; color:var(--text); border:1px solid rgba(0,240,255,.2); border-radius:10px; background:rgba(3,5,8,.72);
    padding:.82rem .95rem; font:700 .95rem 'Rajdhani',sans-serif;
  }
  input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 20px rgba(0,240,255,.16); }
  .tabs { display:flex; flex-wrap:wrap; gap:.5rem; }
  .tab {
    color:var(--muted); border:1px solid rgba(0,240,255,.16); background:rgba(10,20,35,.7); border-radius:99px; min-height:36px;
  }
  .tab.active { color:var(--accent); border-color:var(--accent); background:rgba(0,240,255,.08); }
  .list { display:grid; gap:.8rem; }
  .attendee {
    display:grid; grid-template-columns:56px minmax(0,1fr) auto; gap:1rem; align-items:center;
    border:1px solid var(--border); border-radius:16px; padding:1rem; background:var(--card);
  }
  .avatar {
    width:56px; height:56px; border-radius:50%; display:grid; place-items:center; color:#00150c;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); font:900 1rem 'Orbitron',monospace;
  }
  .attendee h2 { font:900 1rem 'Orbitron',monospace; margin-bottom:.25rem; }
  .mono { color:var(--accent); font:800 .78rem 'Space Mono',monospace; }
  .meta { display:flex; flex-wrap:wrap; gap:.55rem; color:var(--muted); margin:.4rem 0; font-weight:700; }
  .badge { display:inline-flex; border-radius:99px; padding:.25rem .55rem; font:800 .65rem 'Space Mono',monospace; text-transform:uppercase; }
  .registered { color:var(--accent); border:1px solid rgba(0,240,255,.3); background:rgba(0,240,255,.08); }
  .attended { color:var(--green); border:1px solid rgba(0,255,136,.3); background:rgba(0,255,136,.08); }
  .cancelled { color:var(--accent3); border:1px solid rgba(255,45,120,.3); background:rgba(255,45,120,.08); }
  .payment-paid { color:#ffd700; border:1px solid rgba(255,215,0,.3); background:rgba(255,215,0,.08); }
  .actions { display:flex; flex-wrap:wrap; gap:.45rem; justify-content:flex-end; }
  .empty {
    text-align:center; padding:4rem 1rem; color:var(--muted); border:1px solid var(--border); border-radius:18px; background:var(--card);
  }
  .empty-icon { font-size:3rem; margin-bottom:.8rem; }
  .access { display:grid; min-height:70vh; place-items:center; }
  @media (max-width:820px) {
    nav, .hero, .tools { grid-template-columns:1fr; display:grid; align-items:start; }
    .stats { grid-template-columns:repeat(2,1fr); }
    .attendee { grid-template-columns:1fr; }
    .actions { justify-content:flex-start; }
  }
  @media (max-width:480px) { .stats { grid-template-columns:1fr; } .nav-actions { justify-content:flex-start; } }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="logo" href="events.html">EVENT.WORLD</a>
    <div class="nav-title" id="navTitle">Attendees</div>
    <div class="nav-actions">
      <a class="btn ghost" id="scannerLink" href="#">Scanner</a>
      <button class="primary" onclick="exportCsv()">Export CSV</button>
      <button class="ghost" onclick="logout()">Logout</button>
    </div>
  </nav>

  <main id="app">
    <section class="hero">
      <div>
        <div class="eyebrow">Attendee Dashboard</div>
        <h1 id="eventTitle">Loading event...</h1>
        <p id="eventMeta">Fetching registrations.</p>
      </div>
      <div class="updated" id="lastUpdated">Last updated: never</div>
    </section>

    <section class="stats">
      <div class="stat cyan"><strong id="totalRegistered">0</strong><span>Total Registered</span></div>
      <div class="stat ok"><strong id="totalAttended">0</strong><span>Attended</span></div>
      <div class="stat yellow"><strong id="notAttended">0</strong><span>Not Yet Attended</span></div>
      <div class="stat pink"><strong id="totalCancelled">0</strong><span>Cancelled</span></div>
    </section>

    <section class="tools">
      <input id="searchInput" placeholder="Search by name, email, or registration ID" oninput="filterRows()"/>
      <div class="tabs">
        <button class="tab active" onclick="setFilter('all', this)">All</button>
        <button class="tab" onclick="setFilter('registered', this)">Registered</button>
        <button class="tab" onclick="setFilter('attended', this)">Attended</button>
        <button class="tab" onclick="setFilter('cancelled', this)">Cancelled</button>
        <button class="ghost" onclick="loadRegistrations()">Refresh</button>
      </div>
    </section>

    <section class="list" id="attendeeList"></section>
  </main>
</div>

<script>
const store = window.EventWorldStore;
const session = store && store.getSession();
const eventId = new URLSearchParams(window.location.search).get('event_id') || '';
let eventData = null;
let registrations = [];
let activeFilter = 'all';

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]);
}

function initials(name) {
  return String(name || 'EW').split(/\s+/).map(part => part[0]).join('').slice(0,2).toUpperCase();
}

function fmt(value) {
  if (!value) return '-';
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
}

function deny(message) {
  document.body.innerHTML = `<main class="access"><div class="empty"><div class="empty-icon">!</div><h1>${escapeHtml(message)}</h1><p>This page is only for event organizers.</p><a class="btn primary" href="events.html" style="margin-top:1rem">Back to Events</a></div></main>`;
}

async function init() {
  if (!session) {
    window.location.href = 'Login.html';
    return;
  }
  if (!['institution', 'admin'].includes(session.role)) {
    deny('Access denied');
    return;
  }
  if (!eventId) {
    deny('Missing event ID');
    return;
  }
  document.getElementById('scannerLink').href = `gate-scanner.html?event_id=${encodeURIComponent(eventId)}`;
  try {
    eventData = await window.EventWorldAPI.getEventById(eventId);
    document.getElementById('eventTitle').textContent = eventData.title || 'Event';
    document.getElementById('navTitle').textContent = eventData.title || 'Attendees';
    document.getElementById('eventMeta').textContent = `${eventData.college || ''} - ${eventData.date || ''} - ${eventData.location || ''}`;
  } catch (error) {
    deny(error.message || 'Could not load event');
    return;
  }
  await loadRegistrations();
  setInterval(loadRegistrations, 60000);
}

async function loadRegistrations() {
  const query = document.getElementById('searchInput').value.trim();
  const data = await window.EventWorldAPI.getEventRegistrations(eventId, activeFilter, query);
  registrations = data.registrations || [];
  document.getElementById('totalRegistered').textContent = data.total_registered || 0;
  document.getElementById('totalAttended').textContent = data.total_attended || 0;
  document.getElementById('totalCancelled').textContent = data.total_cancelled || 0;
  document.getElementById('notAttended').textContent = Math.max(0, Number(data.total_registered || 0) - Number(data.total_attended || 0));
  document.getElementById('lastUpdated').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
  renderRows();
}

function setFilter(filter, button) {
  activeFilter = filter;
  document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
  button.classList.add('active');
  loadRegistrations();
}

function filterRows() {
  clearTimeout(window.attendeeSearchTimer);
  window.attendeeSearchTimer = setTimeout(loadRegistrations, 250);
}

function renderRows() {
  const list = document.getElementById('attendeeList');
  if (!registrations.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">👥</div><h2>No students registered yet</h2><p>Share your event link to get registrations</p><button class="primary" onclick="shareEvent()">Share Event</button></div>`;
    return;
  }
  list.innerHTML = registrations.map(row => {
    const student = row.student || {};
    const status = row.status || 'registered';
    const payment = row.payment || {};
    const isPaidEvent = eventData && eventData.payment && eventData.payment.is_paid && Number(eventData.payment.amount || 0) > 0;
    const paymentId = payment.razorpay_payment_id || '';
    return `
      <article class="attendee">
        <div class="avatar">${escapeHtml(initials(student.name))}</div>
        <div>
          <h2>${escapeHtml(student.name || 'Student')}</h2>
          <p>${escapeHtml(student.email || '')} ${student.college ? `- ${escapeHtml(student.college)}` : ''}</p>
          <div class="meta">
            <span class="mono">${escapeHtml(row.registration_id)}</span>
            <span>Registered: ${fmt(row.registered_at)}</span>
            ${row.attended_at ? `<span>Attended: ${fmt(row.attended_at)}</span>` : ''}
          </div>
          <span class="badge ${status}">${status === 'attended' ? 'Attended ✅' : status === 'cancelled' ? 'Cancelled ❌' : 'Registered'}</span>
          ${isPaidEvent ? `<span class="badge payment-paid" title="Payment ID: ${escapeHtml(paymentId || 'Not available')}">💳 ${payment.status === 'paid' ? 'Paid' : 'Payment pending'}</span>` : ''}
        </div>
        <div class="actions">
          ${status === 'registered' ? `<button class="green" onclick="markAttended('${row.registration_id}')">Mark Attended</button>` : `<button class="disabled" disabled>${status === 'attended' ? 'Attended' : 'Closed'}</button>`}
          ${status !== 'cancelled' ? `<button class="danger" onclick="cancelRegistration('${row.registration_id}')">Cancel</button>` : ''}
        </div>
      </article>
    `;
  }).join('');
}

async function markAttended(registrationId) {
  const result = await window.EventWorldAPI.scanTicket(registrationId);
  if (!result.valid && result.reason === 'already_used') alert('This ticket was already scanned.');
  await loadRegistrations();
}

async function cancelRegistration(registrationId) {
  if (!confirm('Cancel this registration?')) return;
  await window.EventWorldAPI.cancelRegistration(registrationId);
  await loadRegistrations();
}

async function exportCsv() {
  const csv = await window.EventWorldAPI.exportRegistrations(eventId);
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `attendees-${eventId}.csv`;
  link.click();
  URL.revokeObjectURL(url);
}

function shareEvent() {
  navigator.clipboard.writeText(`${window.location.origin}/event-detail.html?id=${encodeURIComponent(eventId)}`);
  alert('Event link copied.');
}

async function logout() {
  if (window.EventWorldAPI) await window.EventWorldAPI.logout();
  else if (store) store.clearSession();
  window.location.href = 'Login.html';
}

init();
</script>
</body>
</html>
